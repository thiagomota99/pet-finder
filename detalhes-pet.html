<!doctype html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <title>Detalhes do Pet</title>

    <link rel="stylesheet" href="detalhes-pet.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />


</head>

<body>

    <div class="app">


        <!-- HEADER -->

        <header class="header">

            <a class="back" href="explorar.html">
                ‹
            </a>

            <h1 class="title">
                Detalhes Do Pet
            </h1>

            <div class="header-actions">

                <button id="btnEditar" class="edit-button" type="button" style="display: none;" title="Editar pet">
                    ✎
                </button>

            </div>

        </header>


        <!-- FOTO PRINCIPAL -->

        <div class="hero">

            <img id="petFoto" src="assets/bolinha.jpg" alt="Foto do animal">


            <span id="petStatus" class="status">
                Carregando...
            </span>

        </div>



        <!-- INFORMAÇÕES -->

        <main class="sheet">


            <!-- NOME / RAÇA -->

            <div class="topline">

                <div>

                    <h2 id="petNome">
                        Carregando...
                    </h2>


                    <p id="petDescricao">
                        Carregando...
                    </p>

                </div>


                <button class="share" id="btnCompartilhar" type="button">
                    ♧
                </button>

            </div>



            <!-- ESTATÍSTICAS -->

            <div class="stats">


                <div>

                    <small>
                        PORTE
                    </small>


                    <strong id="petPorte">
                        -
                    </strong>

                </div>



                <div>

                    <small>
                        TEMPERAMENTO
                    </small>


                    <strong id="petTemperamento">
                        -
                    </strong>

                </div>


            </div>



            <!-- LOCALIZAÇÃO -->

            <section>

                <h3>
                    Última vez visto
                </h3>


                <p id="petLocalizacao" class="seen">
                    Localização não informada
                </p>


                <div id="petMapa" class="map"></div>
            </section>



            <!-- TUTOR -->

            <div class="tutor">



                <div>

                    <small>
                        Tutor
                    </small>


                    <strong id="petTutor">
                        Carregando...
                    </strong>

                </div>

            </div>



            <!-- CONTATO -->

            <a class="contact" href="#" id="btnContato">
                ▣ &nbsp; Entrar em Contato
            </a>


        </main>

    </div>
    <script src="js/api.js"></script>

    <script src="js/auth.js"></script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script src="js/detalhes-pet.js"></script>

</body>

</html>
