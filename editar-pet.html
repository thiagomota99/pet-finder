<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PetFinder - Editar Pet</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="cadastrar.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
</head>

<body>

    <div class="app">

        <!-- HEADER -->
        <header class="header">

            <div class="brand">
                <span class="paw">🐾</span>
                <strong>PetFinder</strong>
            </div>

            <a href="perfil.html" class="avatar" aria-label="Perfil">
                👤
            </a>

        </header>


        <!-- CONTEÚDO -->
        <main class="content">

            <h1>Editar pet</h1>

            <p class="intro">
                Atualize as informações do seu pet.
            </p>


            <form id="editarPetForm">

                <!-- NOME -->
                <div class="field">

                    <label for="nome">
                        Nome do pet
                    </label>

                    <input type="text" id="nome" class="input" placeholder="Ex.: Rex" required>

                </div>


                <!-- ESPÉCIE -->
                <div class="field">

                    <label for="especie">
                        Espécie
                    </label>

                    <select id="especie" required>

                        <option value="">
                            Selecione
                        </option>

                        <option value="CANINO">
                            Canino
                        </option>

                        <option value="FELINO">
                            Felino
                        </option>

                        <option value="EQUINO">
                            Equino
                        </option>

                    </select>

                </div>


                <!-- RAÇA -->
                <div class="field">

                    <label for="raca">
                        Raça
                    </label>

                    <input type="text" id="raca" class="input" placeholder="Ex.: Labrador" required>

                </div>


                <!-- PORTE -->
                <div class="field">

                    <label>
                        Porte
                    </label>

                    <div class="porte-options">

                        <button type="button" class="porte-btn" data-porte="PEQUENO">
                            Pequeno
                        </button>

                        <button type="button" class="porte-btn" data-porte="MEDIO">
                            Médio
                        </button>

                        <button type="button" class="porte-btn" data-porte="GRANDE">
                            Grande
                        </button>

                    </div>

                </div>


                <!-- TEMPERAMENTO -->
                <div class="field">

                    <label for="temperamento">
                        Temperamento
                    </label>

                    <select id="temperamento" required>

                        <option value="">
                            Selecione
                        </option>

                        <option value="DOCIL">
                            Dócil
                        </option>

                        <option value="ASSUSTADO">
                            Assustado
                        </option>

                        <option value="FEROZ">
                            Feroz
                        </option>

                    </select>

                </div>


                <!-- STATUS -->
                <div class="field">

                    <label for="desaparecido">
                        Status do pet
                    </label>

                    <select id="desaparecido" required>

                        <option value="true">
                            Perdido / Desaparecido
                        </option>

                        <option value="false">
                            Encontrado
                        </option>

                    </select>

                </div>


                <!-- LOCALIZAÇÃO -->
                <div class="field">

                    <label for="localizacao">
                        Última localização vista
                    </label>

                    <div class="location-input">

                        <span>📍</span>

                        <input type="text" id="localizacao" class="input" placeholder="Ex.: Jardim América" required>

                    </div>

                </div>


                <!-- MAPA -->
                <div class="map-wrapper">

                    <div class="map-title">
                        Localização no mapa
                    </div>

                    <div id="map"></div>

                    <p class="map-instruction">
                        📍 Clique no mapa para alterar o local onde o pet foi visto.
                    </p>


                    <!-- COORDENADAS -->
                    <div class="coordinates">

                        <div class="field">

                            <label for="latitude">
                                Latitude
                            </label>

                            <input type="text" id="latitude" class="input" readonly placeholder="Carregando...">

                        </div>


                        <div class="field">

                            <label for="longitude">
                                Longitude
                            </label>

                            <input type="text" id="longitude" class="input" readonly placeholder="Carregando...">

                        </div>

                    </div>

                </div>



                <!-- FOTOS ATUAIS -->
                <div class="field">

                    <label>
                        Fotos atuais
                    </label>

                    <div id="fotosAtuais" class="fotos-atuais">

                        <p class="fotos-vazio">
                            Carregando fotos...
                        </p>

                    </div>

                </div>


                <!-- NOVAS FOTOS -->
                <div class="field">

                    <label for="fotos">
                        Adicionar novas fotos
                    </label>

                    <label class="photo-upload" for="fotos">

                        <span class="photo-icon">
                            📷
                        </span>

                        <span>

                            <strong id="fotoTitulo">
                                Adicionar fotos
                            </strong>

                            <small id="fotoDescricao">
                                Toque para selecionar
                            </small>

                        </span>

                    </label>

                    <input type="file" id="fotos" accept="image/jpeg,image/png,image/webp" multiple hidden>

                </div>


                <!-- TELEFONE -->
                <div class="field">

                    <label>
                        Telefone para contato
                        <span class="whatsapp-label">(WhatsApp)</span>
                    </label>

                    <input type="tel" id="telefone" class="input" placeholder="(62) 99999-9999" maxlength="15" readonly>

                    <small class="field-help">
                        O telefone de contato é definido no seu perfil.
                    </small>

                </div>



                <button type="submit" id="btnSalvar" class="btn-main">
                    💾&nbsp; Salvar alterações
                </button>

                <div class="status-actions">

                    <button type="button" id="btnAlterarStatus" class="btn-status">
                        🟢 Marcar como encontrado
                    </button>

                    <button type="button" id="btnInativar" class="btn-status btn-inativar">
                        ⚪ Inativar anúncio
                    </button>

                </div>

                <button type="button" id="btnCancelar" class="btn-main">
                    Cancelar
                </button>

            </form>

        </main>


        <!-- MENU INFERIOR -->
        <nav class="bottom">

            <a href="explorar.html" class="nav">

                <span class="navicon">
                    ⌕
                </span>

                <span>
                    Explorar
                </span>

            </a>


            <a href="cadastrar.html" class="nav">

                <span class="navicon plus">
                    +
                </span>

                <span>
                    Cadastrar
                </span>

            </a>


            <a href="perfil.html" class="nav">

                <span class="navicon">
                    ♙
                </span>

                <span>
                    Perfil
                </span>

            </a>

        </nav>

    </div>


    <!-- LEAFLET -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="">
    </script>


    <!-- API -->
    <script src="js/api.js"></script>

    <!-- AUTENTICAÇÃO -->
    <script src="js/auth.js"></script>

    <!-- EDIÇÃO -->
    <script src="js/editar-pet.js"></script>

</body>

</html>
