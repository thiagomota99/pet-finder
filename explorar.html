<!doctype html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <title>PetFinder - Explorar</title>

    <link rel="stylesheet" href="explorar.css">

</head>

<body>

    <div class="app">

        <header class="header">

            <div class="brand">
                <span class="paw">🐾</span>
                <span>PetFinder</span>
            </div>

        </header>


        <main class="content">

            <h1 id="saudacao">
                Bom dia!
            </h1>

            <p class="intro">
                Vamos ajudar esses pets a voltarem para casa.
            </p>


            <!-- BUSCA -->

            <div class="search">

                <span>⌕</span>

                <input id="campoBusca" type="text" placeholder="Buscar por raça, nome ou local...">

                <button type="button" id="btnFiltro">
                    ☷
                </button>

            </div>


            <!-- FILTROS -->

            <div class="filters">

                <button type="button" class="active" data-filtro="TODOS">
                    ➤ Próximos
                </button>

                <button type="button" data-filtro="CANINO">
                    Cães
                </button>

                <button type="button" data-filtro="FELINO">
                    Gatos
                </button>

                <button type="button" data-filtro="RECOMPENSA">
                    ♡ Recompensa
                </button>

            </div>


            <!-- ANIMAIS -->

            <div class="cards" id="animaisContainer">

                <p>
                    Carregando animais...
                </p>

            </div>

        </main>


        <!-- MENU INFERIOR -->

        <nav class="bottom">

            <a class="nav active" href="explorar.html">

                <span class="navicon">
                    ◉
                </span>

                Explorar

            </a>


            <a class="nav" href="cadastrar.html">

                <span class="navicon plus">
                    +
                </span>

                Cadastrar

            </a>


            <a class="nav" href="meus-pets.html">

                <span class="navicon">
                    ♡
                </span>

                Meus Pets

            </a>


            <a class="nav" href="perfil.html">

                <span class="navicon">
                    ◎
                </span>

                Perfil

            </a>

        </nav>

    </div>

    <script src="js/api.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/explorar.js"></script>

</body>

</html>
