<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>PetFinder - Cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
</head>

<body>
    <div class="app">

        ```
        <header class="header">
            <a class="back" href="login.html">‹</a>
            <h1 class="title">Cadastro De Usuário</h1>
            <div class="avatar">👩🏻</div>
        </header>

        <main class="content register-page">

            <div class="logo-box">
                <span>🐾</span>
                <strong>PetFinder</strong>
            </div>

            <div class="headline">
                <h2>Junte-se à nossa<br>comunidade</h2>

                <p>
                    Ajude a reunir famílias e seus pets.<br>
                    Cada cadastro faz a diferença.
                </p>
            </div>

            <form class="register-form" id="registerForm">

                <label for="nome">
                    Nome Completo
                </label>

                <div class="input-wrap">
                    <span>♙</span>

                    <input id="nome" name="nome" type="text" placeholder="Ex: Maria Silva" required>
                </div>


                <label for="email">
                    E-mail
                </label>

                <div class="input-wrap">
                    <span>✉</span>

                    <input id="email" name="email" type="email" placeholder="exemplo@email.com" required>
                </div>


                <label for="telefone">
                    Telefone
                </label>

                <div class="input-wrap">
                    <span>☎</span>

                    <input id="telefone" name="telefone" type="tel" placeholder="(62) 99999-9999" required>
                </div>


                <label for="s1">
                    Senha
                </label>

                <div class="input-wrap">
                    <span>♙</span>

                    <input id="s1" name="senha" type="password" placeholder="Mínimo 8 caracteres" minlength="8"
                        required>

                    <button type="button" onclick="toggle('s1')">
                        ◉
                    </button>
                </div>


                <label for="s2">
                    Confirmar Senha
                </label>

                <div class="input-wrap">
                    <span>◴</span>

                    <input id="s2" name="confirmarSenha" type="password" placeholder="Repita a senha" minlength="8"
                        required>

                    <button type="button" onclick="toggle('s2')">
                        ◉
                    </button>
                </div>


                <button class="create" type="submit" id="btnCadastro">
                    Criar Conta &nbsp; →
                </button>


                <p class="register-error" id="registerError" style="display: none;"></p>


                <p class="terms">
                    Ao criar uma conta, você concorda<br>
                    com nossos
                    <a href="#">Termos de Uso</a>
                    e
                    <a href="#">
                        Política<br> de Privacidade
                    </a>.
                </p>

            </form>

            <p class="already">
                Já tem uma conta?
                <a href="login.html">Faça login</a>
            </p>

        </main>
    </div>


    <script>
        function toggle(id) {

            const input =
                document.getElementById(id);

            input.type =
                input.type === 'password'
                    ? 'text'
                    : 'password';
        }
    </script>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cadastro.js"></script>
</body>

</html>
