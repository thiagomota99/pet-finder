<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PetFinder - Cadastro</title><link rel="stylesheet" href="cadastro.css"></head><body><div class="app"><header class="header"><a class="back" href="login.html">‹</a><h1 class="title">Cadastro De Usuário</h1><div class="avatar">👩🏻</div></header><main class="content register-page"><div class="logo-box"><span>🐾</span><strong>PetFinder</strong></div><div class="headline"><h2>Junte-se à nossa<br>comunidade</h2><p>Ajude a reunir famílias e seus pets.<br>Cada cadastro faz a diferença.</p></div><form class="register-form" onsubmit="event.preventDefault();location.href='explorar.html'"><label>Nome Completo</label><div class="input-wrap"><span>♙</span><input placeholder="Ex: Maria Silva" required></div><label>E-mail</label><div class="input-wrap"><span>✉</span><input type="email" placeholder="exemplo@email.com" required></div><label>Senha</label><div class="input-wrap"><span>♙</span><input id="s1" type="password" placeholder="Mínimo 8 caracteres" minlength="8" required><button type="button" onclick="toggle('s1')">◉</button></div><label>Confirmar Senha</label><div class="input-wrap"><span>◴</span><input id="s2" type="password" placeholder="Repita a senha" minlength="8" required><button type="button" onclick="toggle('s2')">◉</button></div><button class="create" type="submit">Criar Conta &nbsp; →</button><p class="terms">Ao criar uma conta, você concorda<br>com nossos <a href="#">Termos de Uso</a> e <a href="#">Política<br> de Privacidade</a>.</p></form><p class="already">Já tem uma conta? <a href="login.html">Faça login</a></p></main></div><script>function toggle(id){const s=document.getElementById(id);s.type=s.type==='password'?'text':'password'}</script></body></html>
