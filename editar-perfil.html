<!doctype html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PetFinder - Editar Perfil</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="editar-perfil.css">

</head>


<body>

    <div class="app">


        <!-- HEADER -->

        <header class="header">

            <a class="back" href="perfil.html">
                ‹
            </a>

            <h1 class="title">
                Editar Perfil
            </h1>

            <div class="avatar">
                👩🏻
            </div>

        </header>


        <!-- CONTEÚDO -->

        <main class="content">


            <section class="form-card">

                <div class="form-header">

                    <div class="profile-avatar">
                        👩🏻
                    </div>

                    <div>

                        <h2>
                            Seus dados
                        </h2>

                        <p>
                            Atualize suas informações pessoais.
                        </p>

                    </div>

                </div>


                <form id="editarPerfilForm">


                    <!-- NOME -->

                    <div class="form-group">

                        <label for="nome">
                            Nome completo
                        </label>

                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required maxlength="100">

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            E-mail
                        </label>

                        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                    </div>


                    <!-- TELEFONE -->

                    <div class="form-group">

                        <label for="telefone">
                            Telefone para contato (WhatsApp)
                        </label>

                        <input type="tel" id="telefone" name="telefone" placeholder="(62) 99999-9999" required>

                    </div>


                    <!-- ERRO -->

                    <div id="formError" class="form-error"></div>


                    <!-- SUCESSO -->

                    <div id="formSuccess" class="form-success"></div>


                    <!-- BOTÃO -->

                    <button type="submit" id="btnSalvar" class="btn-main">
                        Salvar alterações
                    </button>


                    <button type="button" id="btnCancelar" class="btn-cancel">
                        Cancelar
                    </button>


                </form>

            </section>


        </main>


        <!-- MENU INFERIOR -->
        <nav class="bottom">

            <a class="nav" href="explorar.html">

                <span class="navicon">
                    ◉
                </span>

                Explorar

            </a>


            <a class="nav" href="cadastrar.html">

                <span class="navicon plus">
                    +
                </span>

                Cadastrar

            </a>


            <a class="nav" href="meus-pets.html">

                <span class="navicon">
                    ♡
                </span>

                Meus Pets

            </a>


            <a class="nav active" href="perfil.html">

                <span class="navicon">
                    ◎
                </span>

                Perfil

            </a>

        </nav>

    </div>


    <script src="js/api.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/editar-perfil.js"></script>


</body>

</html>
