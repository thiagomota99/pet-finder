<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetFinder - Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="login-page">
        <div class="login-card">
            <div class="logo-big">
                <span>🐾</span>
                <strong>PetFinder</strong>
            </div>
            <h1>Bem-vindo de volta</h1>
            <p>
                Juntos podemos encontrar seu melhor amigo.
            </p>

            <form id="loginForm">
                <label for="email">
                    E-mail
                </label>
                <div class="input-wrap">
                    <span>✉</span>
                    <input id="email" name="email" type="email" placeholder="seu@email.com" required>
                </div>


                <label for="senha">
                    Senha
                </label>
                <div class="input-wrap">
                    <span>♙</span>
                    <input id="senha" name="senha" type="password" placeholder="••••••••" required>
                    <button type="button" onclick="toggle()">
                        ◉
                    </button>
                </div>

                <a class="forgot" href="#">
                    Esqueci minha senha
                </a>

                <button class="enter" type="submit" id="btnLogin">
                    Entrar &nbsp; →
                </button>

                <p id="loginError" style="display: none;"></p>
            </form>

            <p class="register">
                Ainda não tem conta?
                <a href="cadastro.html">
                    Cadastre-se
                </a>
            </p>
        </div>
    </div>
    <script>
        function toggle() {

            const senha =
                document.getElementById("senha");

            senha.type =
                senha.type === "password"
                    ? "text"
                    : "password";
        }

    </script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
