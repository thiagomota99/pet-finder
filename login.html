<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PetFinder - Login</title><link rel="stylesheet" href="login.css"></head><body><div class="login-page"><div class="login-card"><div class="logo-big"><span>🐾</span><strong>PetFinder</strong></div><h1>Bem-vindo de volta</h1><p>Juntos podemos encontrar seu melhor amigo.</p><form onsubmit="event.preventDefault();location.href='explorar.html'"><label>E-mail</label><div class="input-wrap"><span>✉</span><input type="email" placeholder="seu@email.com" required></div><label>Senha</label><div class="input-wrap"><span>♙</span><input id="senha" type="password" placeholder="••••••••" required><button type="button" onclick="toggle()">◉</button></div><a class="forgot" href="#">Esqueci minha senha</a><button class="enter" type="submit">Entrar &nbsp; →</button></form><p class="register">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p></div></div><script>function toggle(){const s=document.getElementById('senha');s.type=s.type==='password'?'text':'password'}</script></body></html>
