<!doctype html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <title>PetFinder - Meus Pets</title>

    <link rel="stylesheet" href="meus-pets.css">

</head>


<body>

    <div class="app">


        <!-- HEADER -->

        <header class="header">

            <a class="back" href="perfil.html">
                ‹
            </a>


            <h1 class="title">
                Meus Pets
            </h1>

        </header>


        <!-- CONTEÚDO -->

        <main class="content">

            <div class="page-intro">

                <h2>
                    Animais cadastrados
                </h2>

                <p>
                    Gerencie os pets que você cadastrou no PetFinder.
                </p>

            </div>


            <!-- LISTA -->

            <section id="animaisContainer" class="pets-container">

                <div class="loading">

                    <span class="loading-icon">
                        🐾
                    </span>

                    <p>
                        Carregando seus pets...
                    </p>

                </div>

            </section>


            <!-- BOTÃO CADASTRAR -->

            <button type="button" id="btnCadastrarPet" class="btn-cadastrar">

                <span class="plus-icon">
                    +
                </span>

                Cadastrar novo pet

            </button>

        </main>


        <!-- MENU INFERIOR -->

        <nav class="bottom">

            <a class="nav" href="explorar.html">

                <span class="navicon">
                    ◉
                </span>

                Explorar

            </a>


            <a class="nav" href="cadastrar.html">

                <span class="navicon plus">
                    +
                </span>

                Cadastrar

            </a>


            <a class="nav active" href="meus-pets.html">

                <span class="navicon">
                    ♡
                </span>

                Meus Pets

            </a>


            <a class="nav" href="perfil.html">

                <span class="navicon">
                    ◎
                </span>

                Perfil

            </a>

        </nav>

    </div>


    <script src="js/api.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/meus-pets.js"></script>

</body>

</html>
