<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PetFinder - Cadastrar Pet</title><link rel="stylesheet" href="cadastrar.css"></head><body><div class="app"><header class="header"><div class="brand"><span class="paw">🐾</span><span>PetFinder</span></div><div class="avatar">👩🏻</div></header><main class="content"><div class="intro"><h1>Cadastrar Pet Perdido</h1><p>Preencha as informações para ajudar a comunidade a encontrar seu pet mais rápido.</p></div><section><h2 class="section-title">Informações Básicas</h2><div class="field"><label>Nome do Pet</label><input class="input" placeholder="Ex: Rex, Luna, sem nome..."></div><div class="two"><div class="field"><label>Espécie</label><select><option>Selecione</option><option>Cachorro</option><option>Gato</option><option>Ave</option><option>Outro</option></select></div><div class="field"><label>Raça</label><input class="input" placeholder="Ex: SRD, Poodle..."></div></div><div class="field"><label>Porte</label><div class="sizes"><button>Pequeno</button><button>Médio</button><button>Grande</button></div></div><div class="field"><label>Temperamento <span>(Opcional)</span></label><input class="input" placeholder="Ex: Assustado, dócil, não se aproxima..."></div></section><section><h2 class="section-title">Localização</h2><div class="field"><label>Última localização vista</label><div class="with-icon"><span>⌖</span><input class="input" placeholder="Rua, Bairro, Ponto de referência..."></div></div><div class="map-placeholder"></div></section><section><h2 class="section-title">Fotos</h2><p class="desc">Fotos claras ajudam muito na identificação.</p><label class="upload"><input type="file" multiple accept="image/*"><span class="upload-icon">📷<b>+</b></span><strong>Adicionar fotos</strong><small>Toque para selecionar</small></label></section><section><h2 class="section-title">Contato</h2><div class="field"><label>Celular (WhatsApp)</label><div class="with-icon"><span class="blue">▯</span><input id="tel" class="input" placeholder="(00) 00000-0000"></div></div></section><button class="btn-main publish" onclick="location.href='explorar.html'">📢 &nbsp; Publicar Anúncio</button></main><nav class="bottom"><a class="nav" href="explorar.html"><span class="navicon">◉</span>Explorar</a><a class="nav active" href="cadastrar.html"><span class="navicon plus">+</span>Cadastrar</a><a class="nav" href="login.html"><span class="navicon">□</span>Mensagens</a><a class="nav" href="login.html"><span class="navicon">◎</span>Perfil</a></nav></div><script>document.querySelectorAll('.sizes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.sizes button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});const tel=document.getElementById('tel');tel.oninput=()=>{let v=tel.value.replace(/\D/g,'').slice(0,11);if(v.length>6)v=v.replace(/^(\d{2})(\d{5})(\d{0,4}).*/,'($1) $2-$3');else if(v.length>2)v=v.replace(/^(\d{2})(\d{0,5})/,'($1) $2');tel.value=v}</script></body></html>
